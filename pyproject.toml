[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cage-pinn"
version = "0.1.0"
description = "Cross-fitted Audit-Guided Enforcement for compute-budgeted PINNs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
authors = [{name = "CAGE-PINN contributors"}]
keywords = ["PINN", "JAX", "scientific-machine-learning", "PDE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "jax>=0.4.30,<0.6",
  "equinox>=0.11.4,<0.13",
  "jaxtyping>=0.2.30,<0.3",
  "optax>=0.2.3,<0.3",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pandas>=2.2,<3",
  "pyarrow>=16,<21",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0.1,<7",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
stats = ["statsmodels>=0.14,<1"]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6.100,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
cage-pinn = "cage_pinn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cage_pinn"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = [
  "integration: lightweight end-to-end tests",
  "scientific: scientific behavior checks that may compile JAX graphs",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

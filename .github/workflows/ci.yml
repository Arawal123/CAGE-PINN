name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,stats]"
      - run: ruff check .
      - run: pytest -q
        env:
          JAX_ENABLE_X64: "True"
          MPLCONFIGDIR: .matplotlib
      - run: python -m cage_pinn.cli literature build
      - run: python -m cage_pinn.cli novelty audit
      - run: python -m cage_pinn.cli benchmark verify-references --points 8 --tolerance 1e-8

